<style> :root { --primary:#0b3a66; --secondary:#0f6fb2; --accent:#7b2ff7; --accent2:#f107a3; --success:#25D366; --dark:#071028; --darker:#031423; --text:#e6eef6; --gray:#9fb6d1; --card-bg:rgba(255,255,255,0.04); --shadow:0 10px 30px rgba(2,6,23,0.6); --transition:all 0.3s ease; } * { box-sizing:border-box; margin:0; padding:0; } body { font-family:'Poppins',sans-serif; background-color:var(--dark); color:var(--text); min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background-image: radial-gradient( circle at 10% 10%, rgba(123,47,247,0.08), transparent 20% ), radial-gradient( circle at 80% 90%, rgba(241,7,163,0.08), transparent 20% ); animation:nebulaFlow 10s ease-in-out infinite alternate; background-attachment:fixed; padding:80px 20px 20px; } @keyframes nebulaFlow { 0% { background-position:10% 10%,80% 90%; } 100% { background-position:20% 20%,70% 80%; } } /* NAVBAR */ .navbar { position:fixed; top:0; left:0; right:0; padding:14px 20px; background:rgba(4,12,28,0.85); backdrop-filter:blur(8px); border-bottom:1px solid rgba(123,47,247,0.15); z-index:1000; text-align:center; } .navbar .brand { color:var(--accent); font-weight:800; font-size:1.2rem; text-decoration:none; letter-spacing:0.5px; } .navbar .brand span { color:#00c6ff; } /* CARD */ .pair-card { background:var(--card-bg); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:38px 30px; max-width:420px; width:100%; box-shadow:var(--shadow); text-align:center; animation:fadeIn 0.8s ease; backdrop-filter:blur(12px); } @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } } .bot-logo { width:70px; height:70px; margin:0 auto 16px; border-radius:20px; display:flex; align-items:center; justify-content:center; background:linear-gradient( 135deg, var(--accent), var(--accent2) ); box-shadow: 0 0 25px rgba(123,47,247,0.45); font-size:22px; font-weight:800; } .pair-card h1 { font-size:1.3rem; font-weight:800; color:var(--accent); margin-bottom:7px; letter-spacing:0.5px; } .pair-card h1 span { color:#00c6ff; } .pair-card p { color:var(--gray); font-size:0.9rem; margin-bottom:22px; line-height:1.5; } /* CHANNEL */ .channel-btn { display:inline-flex; align-items:center; gap:7px; background:rgba(123,47,247,0.15); color:var(--text); border-radius:25px; padding:8px 16px; text-decoration:none; font-weight:600; margin-bottom:22px; } .channel-btn:hover { background:rgba(123,47,247,0.28); transform:translateY(-2px); } .channel-btn i { color:var(--success); } /* INPUT */ label { display:block; color:var(--text); font-weight:600; text-align:left; margin-bottom:7px; font-size:0.9rem; } input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(123,47,247,0.25); background:rgba(255,255,255,0.06); color:var(--text); font-size:0.95rem; margin-bottom:15px; } input::placeholder { color:var(--gray); } input:focus { outline:none; border-color:var(--accent); background:rgba(123,47,247,0.1); box-shadow:0 0 12px rgba(123,47,247,0.15); } /* BUTTON */ .pair-btn { width:100%; padding:13px; border:none; border-radius:10px; font-weight:700; font-size:0.95rem; color:#fff; background: linear-gradient( 90deg, var(--accent), var(--accent2) ); cursor:pointer; margin-bottom:10px; } .pair-btn:hover { filter:brightness(1.1); transform:translateY(-2px); } .pair-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; } /* STATUS */ #status { display:none; margin-top:15px; padding:12px; border-radius:10px; background:rgba(255,255,255,0.05); color:var(--gray); font-size:0.85rem; line-height:1.5; } /* PAIRING CODE */ .code-box { display:none; margin-top:18px; padding:15px; border-radius:12px; background:rgba(0,0,0,0.25); border:1px solid rgba(123,47,247,0.25); } .code-title { font-size:0.8rem; color:var(--gray); margin-bottom:7px; } #pairCode { font-size:1.6rem; font-weight:800; letter-spacing:3px; color:#00c6ff; cursor:pointer; user-select:all; } /* SESSION */ .session-box { display:none; margin-top:18px; text-align:left; } .session-box label { font-size:0.85rem; } #sessionId { width:100%; min-height:110px; resize:none; padding:12px; border-radius:10px; border:1px solid rgba(0,198,255,0.25); background:rgba(0,0,0,0.3); color:#00c6ff; font-size:11px; line-height:1.5; } .copy-btn { width:100%; margin-top:9px; padding:11px; border:none; border-radius:10px; background:linear-gradient( 90deg, #0072ff, #00c6ff ); color:#fff; font-weight:700; cursor:pointer; } .copy-btn:hover { filter:brightness(1.1); } /* FOOTER */ footer { background:var(--darker); padding:24px 20px; margin-top:50px; border-top:1px solid rgba(255,255,255,0.05); width:100%; text-align:center; } .footer-social { display:flex; gap:18px; justify-content:center; margin-bottom:12px; } .footer-social a { color:var(--gray); font-size:1.2rem; transition:0.3s; } .footer-social a:hover { color:var(--accent); transform:translateY(-2px); } .copyright { color:var(--gray); font-size:0.85rem; } .warning { margin-top:10px; font-size:0.72rem; color:#777; } @media(max-width:450px) { .pair-card { padding:30px 20px; } .pair-card h1 { font-size:1.15rem; } #pairCode { font-size:1.35rem; } } </style>

<script> document.getElementById("year").textContent = new Date().getFullYear(); const submitButton = document.getElementById("submit"); const numberInput = document.getElementById("number"); const status = document.getElementById("status"); const codeBox = document.getElementById("codeBox"); const pairCode = document.getElementById("pairCode"); const sessionBox = document.getElementById("sessionBox"); const sessionId = document.getElementById("sessionId"); const copySession = document.getElementById("copySession"); function showStatus(message) { status.style.display = "block"; status.textContent = message; } function normalizeNumber(value) { return value.replace(/\D/g, ""); } /* COPY PAIRING CODE */ pairCode.addEventListener("click", async () => { const code = pairCode.textContent.trim(); if (!code || code === "----") { return; } try { await navigator.clipboard.writeText(code); const oldText = pairCode.textContent; pairCode.textContent = "COPIED!"; setTimeout(() => { pairCode.textContent = oldText; }, 1500); } catch (error) { console.error(error); } }); /* GET PAIRING CODE */ submitButton.addEventListener("click", async (event) => { event.preventDefault(); const number = normalizeNumber(numberInput.value); if (!number) { showStatus( "❌ Enter your WhatsApp number with country code." ); return; } if (number.length < 11) { showStatus( "❌ Invalid phone number format." ); return; } submitButton.disabled = true; submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> REQUESTING CODE...'; codeBox.style.display = "none"; sessionBox.style.display = "none"; showStatus( "⏳ Connecting to WhatsApp..." ); try { /* * Existing BMX pairing endpoint. * * Expected response: * { * "code": "ABCD1234" * } * * If your backend also returns: * { * "sessionId": "MARINYAMETECH~..." * } * the Session ID will automatically appear. */ const response = await fetch("/code?number=" + encodeURIComponent(number)); if (!response.ok) { throw new Error( "Server returned " + response.status ); } const data = await response.json(); if (!data.code) { throw new Error( data.error || "Pairing code unavailable." ); } pairCode.textContent = data.code; codeBox.style.display = "block"; showStatus( "✅ Pairing code generated. Enter it in WhatsApp → Linked Devices → Link with phone number." ); /* * If the pairing backend returns the * complete MARINYAMETECH Session ID, * display it automatically. */ if ( data.sessionId && data.sessionId.startsWith("MARINYAMETECH~") ) { sessionId.value = data.sessionId; sessionBox.style.display = "block"; showStatus( "✅ WhatsApp connected. MARINYAMETECH Session ID generated." ); } } catch (error) { console.error(error); showStatus( "❌ " + (error.message || "Error connecting to server.") ); } finally { submitButton.disabled = false; submitButton.innerHTML = '<i class="fas fa-bolt"></i> GET PAIRING CODE'; } }); /* COPY SESSION ID */ copySession.addEventListener("click", async () => { const value = sessionId.value.trim(); if (!value) { return; } try { await navigator.clipboard.writeText(value); copySession.innerHTML = '<i class="fas fa-check"></i> SESSION COPIED'; setTimeout(() => { copySession.innerHTML = '<i class="fas fa-copy"></i> COPY SESSION ID'; }, 2000); } catch (error) { sessionId.select(); document.execCommand("copy"); copySession.innerHTML = '<i class="fas fa-check"></i> SESSION COPIED'; } }); </script>
